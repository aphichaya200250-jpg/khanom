<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ส่วนตัว - นางสาวอภิชญา เดชวารี</title>
    <!-- นำเข้าฟอนต์ Kanit จาก Google Fonts เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background-color: #ffffff;
            width: 350px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            overflow: hidden;
            padding: 30px 20px;
        }

        .profile-img-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #74b9ff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .profile-nickname {
            font-size: 16px;
            color: #636e72;
            margin-bottom: 20px;
        }

        .profile-info {
            background-color: #f1f2f6;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .info-item {
            margin-bottom: 10px;
            font-size: 14px;
            color: #2d3436;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #0984e3;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- รูปโปรไฟล์ -->
        <div class="profile-img-container">
            <img src="Whan/1234.jpg" alt="รูปโปรไฟล์ของนางสาวอภิชญา เดชวารี">
        </div>

        <!-- ชื่อและชื่อเล่น -->
        <div class="profile-name">นางสาวอภิชญา เดชวารี</div>
        <div class="profile-nickname">ชื่อเล่น: หวาน</div>

        <!-- ข้อมูลการศึกษา -->
        <div class="profile-info">
            <div class="info-item"><span class="info-label">แผนก:</span> คอมพิวเตอร์</div>
            <div class="info-item"><span class="info-label">สาขา:</span> เทคโนโลยีสารสนเทศ</div>
        </div>
    </div>

</body>
</html>
